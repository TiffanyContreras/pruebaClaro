apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clientes-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/TiffanyContreras/pruebaClaro.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true